site_name: W4Studica
site_url: https://w4studica.github.io/
site_description: A community project bringing 2027 WPILib to the Studica VMX-pi.

theme:
  name: material
  language: ko
  features:
    - navigation.tabs

nav:
  - Introduction: index.md
  - C++ API: https://w4studica.github.io/apidocs/
  - GitHub: https://github.com/W4Studica

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: W4Studica
          site_description: A community project bringing 2027 WPILib to the Studica VMX-pi.
        - locale: ko
          name: 한국어
          build: true
          site_name: W4Studica
          site_description: Studica VMX-pi에서 2027 WPILib을 사용하기 위한 커뮤니티 프로젝트.
          nav_translations:
            Introduction: 소개
